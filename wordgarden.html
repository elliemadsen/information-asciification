<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ascii</title>
    <style>
      body {
        background: black;
        color: white;
        overflow: hidden;
        margin: 0;
      }

      .word {
        position: absolute;
        font-family: Courier New, monospace;
        cursor: pointer;
        transition: transform 0.1s linear;
        user-select: none;
      }

      .image-preview {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: none;
        max-width: 50vw;
        max-height: 50vh;
      }
    </style>
  </head>
  <body>
    <img id="preview" class="image-preview" />

    <script>
      const words = [
        "Point Cloud",
        "Digital Garden",
        "Cyber Ecology",
        "Pixel Landscape",
        "Text-ure",
        "Hypertext As Portal",
        "Handmade Web",
      ];
      const speeds = [];
      const elements = [];

      const preview = document.getElementById("preview");
      const body = document.body;
      const width = window.innerWidth;
      const height = window.innerHeight;

      // create words
      words.forEach((word) => {
        const el = document.createElement("div");
        el.className = "word";
        el.textContent = word;
        el.style.left = Math.random() * width + "px";
        el.style.top = Math.random() * height + "px";
        body.appendChild(el);

        elements.push(el);
        speeds.push({
          x: (Math.random() * 0.5 + 0.2) * (Math.random() < 0.5 ? -1 : 1),
          y: (Math.random() * 0.5 + 0.2) * (Math.random() < 0.5 ? -1 : 1),
          paused: false,
        });

        el.addEventListener("mouseenter", () => {
          speeds[words.indexOf(word)].paused = true;
          const filename = word.replace(/\s+/g, "");
          fetch(`img/${filename}.png`).then((res) => {
            preview.src = res.ok
              ? `img/${filename}.png`
              : `img/${filename}.gif`;
            preview.style.display = "block";
          });
        });

        el.addEventListener("mouseleave", () => {
          speeds[words.indexOf(word)].paused = false;
          preview.style.display = "none";
        });
      });

      function animate() {
        elements.forEach((el, i) => {
          if (speeds[i].paused) return;

          let x = parseFloat(el.style.left);
          let y = parseFloat(el.style.top);

          x += speeds[i].x;
          y += speeds[i].y;

          const rect = el.getBoundingClientRect();

          if (x <= 0 || x + rect.width >= width) speeds[i].x *= -1;
          if (y <= 0 || y + rect.height >= height) speeds[i].y *= -1;

          el.style.left = x + "px";
          el.style.top = y + "px";
        });

        requestAnimationFrame(animate);
      }

      animate();
    </script>
  </body>
</html>
