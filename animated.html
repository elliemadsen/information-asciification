<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ascii</title>
    <style>
      html,
      body {
        height: 100%;
        width: 100%;
        margin: 0;
        background: #000;
        color: #d8eaf2;
        font-family: "Courier New", monospace;
        overflow: hidden;
      }
      pre {
        margin: 0;
        white-space: pre;
        letter-spacing: 0;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <pre id="screen"></pre>

    <script>
      function hash2(ix, iy) {
        let h = ix * 374761393 + iy * 668265263;
        h = (h ^ (h >>> 13)) * 1274126177;
        return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
      }
      function fade(t) {
        return t * t * t * (t * (t * 6 - 15) + 10);
      }
      function valueNoise2(x, y) {
        const xi = Math.floor(x),
          yi = Math.floor(y);
        const xf = x - xi,
          yf = y - yi;
        const v00 = hash2(xi, yi),
          v10 = hash2(xi + 1, yi),
          v01 = hash2(xi, yi + 1),
          v11 = hash2(xi + 1, yi + 1);
        const u = fade(xf),
          v = fade(yf);
        const ix0 = v00 * (1 - u) + v10 * u,
          ix1 = v01 * (1 - u) + v11 * u;
        return ix0 * (1 - v) + ix1 * v;
      }
      function fbm(x, y, octaves, lacunarity, gain) {
        let amp = 1,
          freq = 1,
          sum = 0,
          max = 0;
        for (let i = 0; i < octaves; i++) {
          sum += (valueNoise2(x * freq, y * freq) - 0.5) * amp;
          max += amp;
          amp *= gain;
          freq *= lacunarity;
        }
        return sum / max;
      }

      const ramp = " .:-=+*#%@"; // simplified ramp to emphasize contrast
      const pre = document.getElementById("screen");

      function measureChar() {
        const span = document.createElement("span");
        span.style.fontFamily = getComputedStyle(pre).fontFamily;
        span.style.fontSize = getComputedStyle(pre).fontSize;
        span.style.visibility = "hidden";
        span.textContent = "M";
        document.body.appendChild(span);
        const rect = span.getBoundingClientRect();
        span.remove();
        return { w: rect.width, h: rect.height };
      }

      let cols, rows, charSize;
      function resizeGrid() {
        charSize = measureChar();
        cols = Math.floor(window.innerWidth / charSize.w);
        rows = Math.floor(window.innerHeight / (charSize.h * 0.9));
      }
      window.addEventListener("resize", resizeGrid);
      resizeGrid();

      let z = 0,
        speed = 0.02;

      function render() {
        z += speed;
        const baseFreq = 0.02;
        let out = "";
        for (let y = 0; y < rows; y++) {
          for (let x = 0; x < cols; x++) {
            const nx = x / cols - 0.5,
              ny = y / rows - 0.5;
            let val = fbm(nx / baseFreq, ny / (baseFreq * 0.6), 5, 2.0, 0.5);
            val += Math.sin(nx * 5 + z * 0.5) * 0.15;
            val = val + 0.5; // rescale roughly 0–1
            if (val < 0.25) {
              out += " ";
              continue;
            } // black void region
            const idx = Math.floor(((val - 0.25) / 0.75) * (ramp.length - 1));
            out += ramp[Math.max(0, Math.min(ramp.length - 1, idx))];
          }
          out += "\n";
        }
        pre.textContent = out;
        requestAnimationFrame(render);
      }
      render();
    </script>
  </body>
</html>
